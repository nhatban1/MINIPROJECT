<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - NOVA PC</title>
    <link rel="stylesheet" href="../css/login_logout.css">
</head>
<body>
    <div class="theme-control">
        <label for="themeSelect">Giao diện</label>
        <select id="themeSelect">
            <option value="system">Theo hệ thống</option>
            <option value="light">Sáng</option>
            <option value="dark">Tối</option>
        </select>
    </div>

    <main class="container">
        <section class="form-wrap">
            <form id="signupForm" class="signup-form">
                <h1>Tạo tài khoản</h1>
                <p class="subtitle">Nhập thông tin để đăng ký</p>

                <div class="field">
                    <label for="fullName">Họ và tên</label>
                    <input id="fullName" name="fullName" type="text" placeholder="Nhập họ và tên" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="signupEmail">Email</label>
                    <input id="signupEmail" name="signupEmail" type="email" placeholder="Nhập email" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="signupPassword">Mật khẩu</label>
                    <input id="signupPassword" name="signupPassword" type="password" placeholder="Tối thiểu 4 ký tự" autocomplete="new-password" minlength="4" required>
                </div>

                <div class="field">
                    <label for="confirmPassword">Nhập lại mật khẩu</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password" minlength="4" required>
                </div>

                <button class="primary-button" type="submit">Đăng ký</button>
                <p class="message" id="signupMessage" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="../js/login.js"></script>
</body>
</html>
