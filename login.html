<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - NOVA PC</title>
    <link rel="stylesheet" href="../css/login_logout.css">
</head>
<body>
    <div class="theme-control">
        <label for="themeSelect">Giao diện</label>
        <select id="themeSelect">
            <option value="system">Theo hệ thống</option>
            <option value="light">Sáng</option>
            <option value="dark">Tối</option>
        </select>
    </div>

    <main class="container">
        <section class="form-wrap">
            <form id="loginForm" class="login-form">
                <h1>Đăng nhập</h1>
                <p class="subtitle">Nhập thông tin tài khoản của bạn</p>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="Nhập email" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrap">
                        <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" minlength="4" required>
                        <button class="show-password toggle-password" type="button" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember"><input type="checkbox" name="remember"> Ghi nhớ đăng nhập</label>
                    <a href="#" id="forgotPassword">Quên mật khẩu?</a>
                </div>

                <button class="primary-button" type="submit">Đăng nhập</button>
                <p class="message" id="loginMessage" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="../js/login.js"></script>
</body>
</html>
