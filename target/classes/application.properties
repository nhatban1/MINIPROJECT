spring.application.name=novagear-store
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/novagear;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
novagear.ai.chat-completions-url=${NOVAGEAR_AI_CHAT_COMPLETIONS_URL:}
novagear.ai.api-key=${NOVAGEAR_AI_API_KEY:}
novagear.ai.model=${NOVAGEAR_AI_MODEL:gpt-4o-mini}
