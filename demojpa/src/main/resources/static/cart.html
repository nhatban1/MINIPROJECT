<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - Cửa hàng Linh kiện PC</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 30px; background-color: #f7f5fa; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #e8e2ee; padding-bottom: 15px; }
        h1 { margin: 0; color: #594a82; font-size: 24px; }
        
        table { width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 12px rgba(107, 91, 149, 0.05); border: 1px solid #e8e2ee; margin-bottom: 20px; }
        th, td { border-bottom: 1px solid #e8e2ee; padding: 12px 15px; text-align: left; font-size: 14px; }
        th { background-color: #e8e2ee; color: #4a3d6e; font-weight: bold; }
        tr:hover { background-color: #faf8fc; }
        
        .cart-summary { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #e8e2ee; box-shadow: 0 4px 12px rgba(107, 91, 149, 0.05); }
        .total-price { font-size: 18px; font-weight: bold; color: #8856a7; }
        
        .btn { padding: 9px 16px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 13px; border: none; cursor: pointer; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-back { background-color: #bfaecb; color: white; display: inline-block; }
        .btn-danger { background-color: #d96868; color: white; }
        .btn-success { background-color: #72a0c1; color: white; }
        .empty-cart { text-align: center; color: #7a738c; padding: 40px; font-size: 16px; background: #ffffff; border-radius: 8px; border: 1px solid #e8e2ee; }
    </style>
</head>
<body>

    <header>
        <h1>Giỏ hàng của bạn</h1>
    </header>

    <div id="cart-content"></div>

    <script>
        window.onload = function() {
            loadCart();
        };

        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('pc_cart')) || [];
            const container = document.getElementById('cart-content');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">Giỏ hàng của bạn đang trống.</div>
                    <div style="margin-top: 20px;">
                        <a href="home.html" class="btn btn-back">&larr; Tiếp tục mua sắm</a>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Tên linh kiện</th>
                            <th>Mã SKU</th>
                            <th>Loại</th>
                            <th>Đơn giá</th>
                            <th>Số lượng</th>
                            <th>Thành tiền</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            let grandTotal = 0;

            cart.forEach((item, index) => {
                let itemTotal = item.price * item.quantity;
                grandTotal += itemTotal;

                html += `
                    <tr>
                        <td style="font-weight: bold; color: #2c253d;">${item.name}</td>
                        <td>${item.sku || 'N/A'}</td>
                        <td>${item.categoryName || 'Chưa phân loại'}</td>
                        <td>${Number(item.price).toLocaleString('vi-VN')} VNĐ</td>
                        <td>${item.quantity}</td>
                        <td style="font-weight: bold; color: #8856a7;">${Number(itemTotal).toLocaleString('vi-VN')} VNĐ</td>
                        <td>
                            <button class="btn btn-danger" onclick="removeItem(${index})" style="padding: 5px 10px;">Xóa</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
                <div class="cart-summary">
                    <div>
                        <a href="home.html" class="btn btn-back">&larr; Tiếp tục mua sắm</a>
                    </div>
                    <div class="total-price">
                        Tổng tiền: ${Number(grandTotal).toLocaleString('vi-VN')} VNĐ
                    </div>
                    <div>
                        <button class="btn btn-success" onclick="checkout()">Thanh toán</button>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('pc_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('pc_cart', JSON.stringify(cart));
            loadCart();
        }

        function checkout() {
            alert('Thanh toán thành công! Cảm ơn bạn đã mua hàng.');
            localStorage.removeItem('pc_cart');
            loadCart();
        }
    </script>
</body>
</html>
