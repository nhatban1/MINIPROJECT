<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Cửa hàng Linh kiện PC</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f7f5fa; display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; }
        .auth-container { background: #ffffff; border: 1px solid #e8e2ee; border-radius: 8px; padding: 30px; width: 350px; box-shadow: 0 4px 12px rgba(107, 91, 149, 0.05); }
        h2 { color: #594a82; margin-top: 0; margin-bottom: 20px; text-align: center; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #4a3d6e; font-weight: bold; margin-bottom: 5px; }
        input { padding: 9px; width: 100%; border: 1px solid #dcd6e4; border-radius: 6px; background: #faf8fc; box-sizing: border-box; font-size: 13px; }
        input:focus { outline: none; border-color: #8878b0; background: #fff; }
        .btn { width: 100%; padding: 10px; background-color: #6b5b95; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }
        .auth-link { text-align: center; margin-top: 15px; font-size: 13px; color: #7a738c; }
        .auth-link a { color: #594a82; text-decoration: none; font-weight: bold; }
        .auth-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>Đăng Ký Tài Khoản</h2>
        <div class="form-group">
            <label>Tên đăng nhập:</label>
            <input type="text" id="username" placeholder="Nhập username...">
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>
        <button class="btn" onclick="register()">Đăng Ký</button>
        
        <div class="auth-link">
            Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
        </div>
    </div>

    <script>
        async function register() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                alert('Vui lòng điền đầy đủ thông tin!');
                return;
            }

            try {
                // Gọi API gửi dữ liệu xuống Spring Boot để lưu vào bảng users trong MySQL
                const res = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    alert('Đăng ký tài khoản thành công!');
                    window.location.href = 'login.html';
                } else {
                    const errText = await res.text();
                    alert('Đăng ký thất bại: ' + errText);
                }
            } catch (err) {
                console.error('Lỗi:', err);
                alert('Không thể kết nối đến máy chủ!');
            }
        }
    </script>
</body>
</html>
