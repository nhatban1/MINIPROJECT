<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Bán Linh kiện PC</title>
    <style>
        /* Thiết lập tổng thể màn hình */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f7f5fa; display: flex; height: 100vh; overflow: hidden; }
        
        /* 1. Phần Sidebar cố định bên trái (Tông Lavender đậm sang trọng) */
        sidebar { width: 250px; background: #6b5b95; color: white; height: 100%; padding-top: 20px; box-sizing: border-box; flex-shrink: 0; box-shadow: 2px 0 8px rgba(107, 91, 149, 0.15); }
        sidebar h2 { text-align: center; font-size: 18px; margin-bottom: 30px; color: #f3eff5; letter-spacing: 0.5px; }
        sidebar a { display: block; color: #dcd6e4; padding: 15px 20px; text-decoration: none; font-size: 15px; transition: 0.2s; cursor: pointer; border-left: 4px solid transparent; }
        sidebar a:hover { background: #594a82; color: white; }
        sidebar a.active { background: #8878b0; color: white; border-left: 4px solid #dcd6e4; }

        /* 2. Vùng chứa nội dung bên phải (Khung iframe) */
        .content-area { flex-grow: 1; height: 100%; background: #ffffff; }
        
        /* Thẻ iframe chiếm trọn vùng bên phải, không viền */
        iframe { width: 100%; height: 100%; border: none; }
        a { font-weight: bold; }
    </style>
</head>
<body>

    <!-- SIDEBAR BÊN TRÁI -->
    <sidebar>
        <h2>Trang Linh Kiện PC</h2>
        <a onclick="loadPage('home.html', this)" id="nav-home" class="active">Trang Chủ (Cửa hàng)</a>
        <a onclick="loadPage('index.html', this)" id="nav-admin">Quản Lý Linh Kiện</a>
    </sidebar>

    <!-- VÙNG HIỂN THỊ NỘI DUNG -->
    <div class="content-area">
        <iframe id="main-frame" src="home.html"></iframe>
    </div>

    <script>
        function loadPage(pageUrl, element) {
            document.getElementById('main-frame').src = pageUrl;
            const links = document.querySelectorAll('sidebar a');
            links.forEach(link => link.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
